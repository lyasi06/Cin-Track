<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack : catalogue de films et séries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body class=" bg-black">
    <header class="mx-auto flex items-center sm:flex-row sm:items-center border-b-4 sm:justify-between">
        <div class="ml-2 items-center mt-5 mb-5 flex italic">
            <img src="./img/images-removebg-preview.png" alt="video image" class="h-20">
            <strong><span class="text-amber-50 text-5xl">Ciné</span><span class="text-red-500 text-5xl">Track</span></strong>
        </div>
        <div class="flex items-center mt-5">
            <img src="./img/1581424-.png" alt="red point" class="w-9 mt-0.5 h-5">
        <strong><p class="text-amber-50 italic mr-5">Votre sélection cinéma</p></strong>
        </div>
    </header>
    <!-- <aside id="favaorites-sidebar" class="fixed top-0 right-0 w-80 h-full overflow-y-auto bg-slate-800 border-l border-slate-700 text-white p-6 flex flex-col">
        <h2 class="font-bold text-xl">Mes favoris</h2>
        <div id="fav-list" class="mt-4 flex flex-col gap-3"></div>
    </aside> -->
        <div class="flex">
            <aside id="favorites-sidebar" class="sticky top-0 self-start h-screen w-80 shrink-0 overflow-y-auto bg-slate-800 border-l border-slate-700 text-white p-6 flex flex-col">
            <h2 class="font-bold text-xl">Mes favoris</h2>
            <div id="fav-list" class="mt-4 flex flex-col gap-3"></div>
        </aside>
        <main class="flex-1 min-w-0">
        <section>
            <form>
                <div class="mt-5 flex gap-[48%]">
                <input id="recherch" class="w-[40%] rounded-lg border border-slate-500 bg-slate-800 px-3 py-2 text-white italic focus:outline-none ml-5 focus:ring-2 focus:ring-blue-600" id="recherch" name="Recherch" placeholder="rechercher un film ou un séries" required>
           
            <select name="status" id="status" class="w-[7%] rounded-lg border border-slate-500 bg-slate-800 px-3 py-2 text-white italic focus:outline-none focus:ring-2 focus:ring-blue-600">
            <option value="tous">Tous</option>
            <option value="film">Film</option>
            <option value="series">Series</option>
            </select>
            </div>
        </form>
    </section>
    <p id="error" class="hidden m-5 p-4 bg-red-600 text-white rounded"></p>
    <div id="list" class="grid m-4 grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>
    
    </div>
    <div id="modale" class="hidden fixed inset-0 bg-black/80 flex items-center"><div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">
  <div id="modal-content" class="relative bg-zinc-900 text-white rounded-xl p-6 w-full max-w-2xl max-h-full overflow-y-auto"></div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
